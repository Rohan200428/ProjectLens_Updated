spring.application.name=ProjectLens
evaluation.mode=${EVALUATION_MODE:AUTO}
evaluation.api-key=${GEMINI_API_KEY:}
evaluation.model=${GEMINI_MODEL:gemini-2.5-flash}
evaluation.timeout-seconds=${GEMINI_TIMEOUT_SECONDS:12}
server.port=${SERVER_PORT:8080}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/projectlens_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:projectlens}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.time-zone=UTC
server.error.include-message=never
spring.profiles.default=dev
projectlens.review-threshold=${REVIEW_THRESHOLD:70}
projectlens.overlap-medium=${OVERLAP_MEDIUM:0.25}
projectlens.overlap-high=${OVERLAP_HIGH:0.55}
projectlens.jwt-secret=${JWT_SECRET:}
projectlens.jwt-hours=${JWT_HOURS:8}
projectlens.cors-origins=${CORS_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}
projectlens.seed-enabled=${SEED_ENABLED:true}
projectlens.seed-password=${SEED_PASSWORD:ProjectLens123!}
